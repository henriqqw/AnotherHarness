# Minimal live counterpart for the persistent-pwsh-padded-completion snapshot composition.
- id: llm-deepseek
  name: '@anotherharness/ah-llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@anotherharness/ah-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@anotherharness/ah-subprocess-local'

- insert:
    - id: terminal
      name: '@anotherharness/ah-terminal'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@anotherharness/ah-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@anotherharness/ah-session-persistence-jsonl'
  config:
    root: !!js ahHomePath('sessions')
    compression: !!js 'process.env.AH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@anotherharness/ah-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@anotherharness/ah-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@anotherharness/ah-tool-jobs'
  disabled: true

- id: goal
  name: '@anotherharness/ah-goal'
  disabled: true

- id: goal-round-driver
  name: '@anotherharness/ah-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@anotherharness/ah-command-goal'
  disabled: true

- id: tool-goal
  name: '@anotherharness/ah-tool-goal'
  disabled: true

- id: skill
  name: '@anotherharness/ah-skill'
  disabled: true

- id: skill-filesystem
  name: '@anotherharness/ah-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@anotherharness/ah-tool-skill'
  disabled: true

- id: tool-bash
  name: '@anotherharness/ah-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@anotherharness/ah-tool-pwsh-persistent'
