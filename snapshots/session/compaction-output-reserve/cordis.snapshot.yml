# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 6,782 to 5,782, between the history and its condensed replacement.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@anotherharness/ah-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@anotherharness/ah-session-persistence-jsonl'
  config:
    root: !!js ahHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@anotherharness/ah-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@anotherharness/ah-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8582
                defaultMaxTokens: 1000
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
