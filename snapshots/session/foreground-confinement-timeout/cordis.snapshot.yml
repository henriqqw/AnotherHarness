# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@anotherharness/ah-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@anotherharness/ah-session-persistence-jsonl'
  config:
    root: !!js ahHomePath('sessions')
    compression: none

- id: sandbox
  name: '@anotherharness/ah-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@anotherharness/ah-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# Bound foreground preparation before any native process is allocated.
- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- insert:
    - id: pending-confinement-fixture
      name: '../../../packages/shell/bash-sandbox/tests/fixtures/pending-confinement.ts'
