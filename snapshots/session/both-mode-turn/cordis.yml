# PTC mode executes the recorded program through run_code and its TypeScript
# SDK. Recording applies this profile patch; replay applies its sibling patch.
- id: agent-default-model
  name: '@anotherharness/ah-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@anotherharness/ah-session-persistence-jsonl'
  config:
    root: !!js ahHomePath('sessions')
    compression: !!js 'process.env.AH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@anotherharness/ah-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@anotherharness/ah-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@anotherharness/ah-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
