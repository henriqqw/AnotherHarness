# Workspace-context snapshot patch: the harness exports AH_HOME=<cwd>/.ah and
# AH_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@anotherharness/ah-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@anotherharness/ah-session-persistence-jsonl'
  config:
    root: !!js ahHomePath('sessions')
    compression: !!js 'process.env.AH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@anotherharness/ah-agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .ah-project

- id: system-prompt
  name: '@anotherharness/ah-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
