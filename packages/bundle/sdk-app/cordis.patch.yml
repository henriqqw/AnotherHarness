# The SDK application over ah-base. Stdout belongs exclusively to JSON-RPC.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@anotherharness/ah-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@anotherharness/ah-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.AH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.AH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

# The packaged carrier supplies a default; AH_PRIMARY_RUNTIME overrides it,
# including an empty-string opt-out. Each row can be patched independently.
- insert:
    - id: workspace-dependencies
      name: '@anotherharness/ah-tool-workspace-dependencies'
      disabled: !!js "!(process.env.AH_PRIMARY_RUNTIME ?? process.env.AH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.AH_PRIMARY_RUNTIME ?? process.env.AH_BUNDLED_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@anotherharness/ah-skill-office'
      disabled: !!js "!(process.env.AH_PRIMARY_RUNTIME ?? process.env.AH_BUNDLED_PRIMARY_RUNTIME) && !process.env.AH_BUNDLED_OFFICE_CLI"
      config:
        assetRoot: !!js "process.env.AH_BUNDLED_OFFICE_SKILLS ?? process.getBuiltinModule('node:path').resolve(process.env.AH_PRIMARY_RUNTIME ?? process.env.AH_BUNDLED_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"
        cli: !!js "process.env.AH_BUNDLED_OFFICE_CLI === '' ? false : process.env.AH_BUNDLED_OFFICE_CLI"
        node: !!js "process.env.AH_BUNDLED_OFFICE_NODE ?? process.getBuiltinModule('node:path').resolve(process.env.AH_PRIMARY_RUNTIME ?? process.env.AH_BUNDLED_PRIMARY_RUNTIME ?? '', 'dependencies', 'node', 'bin', process.platform === 'win32' ? 'node.exe' : 'node')"
