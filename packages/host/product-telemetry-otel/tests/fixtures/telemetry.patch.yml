- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@anotherharness/ah-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.AH_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: ah-telemetry-test
        serviceVersion: !!js process.env.AH_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000
